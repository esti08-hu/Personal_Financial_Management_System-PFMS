services:
  # PostgreSQL database service
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: full_stack_auth_db
    container_name: postgres
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles: ['dev']

  # Backend service (Nest.js)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: pfms-api
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - app-network
    env_file:
      - docker.env
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles: ['dev']

  # Frontend service (Next.js)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: pfms-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - app-network
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      HOSTNAME: "0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles: ['dev']

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
